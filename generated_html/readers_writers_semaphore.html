<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Readers-Writers — Semaphore Solution</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f3f5f9;color:#172033;text-align:center}header{padding:20px 5vw 8px}header h1{margin:0 0 8px;font-size:28px}main{max-width:900px;margin:10px auto;padding:0 16px}.panel{background:white;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px #14213d12}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}button{border:0;border-radius:8px;padding:10px 15px;background:#315b8a;color:white;cursor:pointer}button:disabled{opacity:.4;cursor:default}input{width:min(400px,70vw)}.actors{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.actor{border:1px solid #dce2ec;border-radius:10px;padding:12px;background:#fafcff}.state{display:inline-block;margin-top:8px;padding:5px 9px;border-radius:20px;background:#e4ebf6;font-size:.9rem}.resource{white-space:pre-wrap;background:#f7f8fb;border-left:4px solid #d2a74c;padding:12px;border-radius:6px;text-align:left}.event{padding:9px 10px;border-bottom:1px solid #edf0f5;cursor:pointer;text-align:left}.event.active{background:#e9f1ff;border-radius:7px}.muted{color:#637087;font-size:.92rem}.subtitle{margin:8px 0 16px;color:#637087;font-size:14px}.table-area{position:relative;width:min(440px,90vw);height:min(360px,74vw);min-height:290px;margin:0 auto 8px}.round-table{position:absolute;width:58%;height:76%;left:21%;top:10%;border-radius:50%;background:#ead9bb;border:8px solid #b89e71;box-sizing:border-box}.philosopher{position:absolute;z-index:2;width:58px;height:48px;border-radius:13px;background:#637792;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:bold;font-size:13px;box-shadow:0 2px 4px #0002}.philosopher span{font-size:11px;font-weight:normal;margin-top:3px}.p0{left:42%;top:8%}.p1{right:8%;top:39%}.p2{left:42%;bottom:7%}.p3{left:8%;top:39%}.fork{position:absolute;z-index:3;min-width:38px;padding:5px 7px;background:#f1f3f7;border:1px solid #aeb8c8;border-radius:8px;font-size:12px;line-height:1.3}.fork small{font-size:10px;font-weight:normal}.fork0{right:24%;top:24%}.fork1{right:24%;bottom:23%}.fork2{left:24%;bottom:23%}.fork3{left:24%;top:24%}.fork.busy{background:#f5c56a;border-color:#c48b26}.philosopher.eating{background:#27845a}.philosopher.hungry{background:#c98228}#tableStatus{margin:8px}.table-controls{margin:12px 0}.table-controls input{width:90px}@media(max-width:500px){.table-area{min-height:270px}.philosopher{width:52px;height:44px}.round-table{border-width:6px}}</style></head><body><header><h1>Readers-Writers — Semaphore Solution</h1></header><main><section class="panel"><h2>Playback controls</h2><div class="controls"><button id="start">Start</button><button id="pause">Pause</button><button id="reset">Reset</button><label for="speed">Speed</label><select id="speed"><option value="1200">Slow</option><option value="700" selected>Normal</option><option value="250">Fast</option></select></div><p id="counter" class="muted"></p><input id="scrubber" type="range" min="0" max="0" value="0" aria-label="Event timeline"></section><section class="panel"><h2>Process / philosopher states</h2><div id="actors" class="actors"></div></section><section class="panel"><h2>Shared resource status</h2><div id="resources" class="resource"></div></section><section class="panel"><h2>Execution Timeline</h2><div id="currentEvent"></div><div id="timeline"></div></section><p class="muted">Generated from recorded Java execution events. This page replays the recorded run.</p></main><script>const labels=["Reader 1","Reader 2","Reader 3","Writer 1","Writer 2"];const events=[{"message":"Simulation created.","resources":"Shared resource is available; no reader or writer is active.","states":["Not started","Not started","Not started","Not started","Not started"]},{"message":"Writer 1 is waiting to write.","resources":"Shared resource: available\nActive readers: 0\nWriter active: false","states":["Not started","Not started","Not started","Waiting","Not started"]},{"message":"Writer 1 entered the write section exclusively.","resources":"Shared resource: being written by a writer\nActive readers: 0\nWriter active: true","states":["Not started","Not started","Not started","Writing","Not started"]},{"message":"Reader 2 is waiting to read.","resources":"Shared resource: available\nActive readers: 0\nWriter active: false","states":["Not started","Waiting","Not started","Writing","Not started"]},{"message":"Reader 1 is waiting to read.","resources":"Shared resource: available\nActive readers: 0\nWriter active: false","states":["Waiting","Waiting","Not started","Writing","Not started"]},{"message":"Writer 2 is waiting to write.","resources":"Shared resource: available\nActive readers: 0\nWriter active: false","states":["Waiting","Waiting","Not started","Writing","Waiting"]},{"message":"Reader 3 is waiting to read.","resources":"Shared resource: available\nActive readers: 0\nWriter active: false","states":["Waiting","Waiting","Waiting","Writing","Waiting"]},{"message":"Reader 2 entered the read section.","resources":"Shared resource: being read by 1 reader(s)\nActive readers: 1\nWriter active: false","states":["Waiting","Reading","Waiting","Writing","Waiting"]},{"message":"Reader 1 entered the read section.","resources":"Shared resource: being read by 2 reader(s)\nActive readers: 2\nWriter active: false","states":["Reading","Reading","Waiting","Writing","Waiting"]},{"message":"Reader 3 entered the read section.","resources":"Shared resource: being read by 3 reader(s)\nActive readers: 3\nWriter active: false","states":["Reading","Reading","Reading","Writing","Waiting"]},{"message":"Writer 1 finished writing and released the resource.","resources":"Shared resource: being read by 1 reader(s)\nActive readers: 3\nWriter active: false","states":["Reading","Reading","Reading","Finished","Waiting"]},{"message":"Reader 1 left the read section.","resources":"Shared resource: being read by 2 reader(s)\nActive readers: 2\nWriter active: false","states":["Finished","Reading","Reading","Finished","Waiting"]},{"message":"Reader 2 left the read section.","resources":"Shared resource: being read by 1 reader(s)\nActive readers: 1\nWriter active: false","states":["Finished","Finished","Reading","Finished","Waiting"]},{"message":"Writer 2 entered the write section exclusively.","resources":"Shared resource: being written by a writer\nActive readers: 0\nWriter active: true","states":["Finished","Finished","Reading","Finished","Writing"]},{"message":"Reader 3 left the read section.","resources":"Shared resource: being written by a writer\nActive readers: 0\nWriter active: true","states":["Finished","Finished","Finished","Finished","Writing"]},{"message":"Writer 2 finished writing and released the resource.","resources":"Shared resource: available\nActive readers: 0\nWriter active: false","states":["Finished","Finished","Finished","Finished","Finished"]}];const dining=false;let index=0,timer=null;const $=id=>document.getElementById(id);function safe(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));}function render(i){if(!events.length)return;index=Math.max(0,Math.min(events.length-1,i));const e=events[index];$('counter').textContent='Event '+(index+1)+' of '+events.length;$('scrubber').value=index;if(dining){for(let j=0;j<4;j++){let state=e.states[j]||'Thinking';let el=$('actor'+j);el.className='philosopher p'+j;if(state.toLowerCase().includes('eat'))el.classList.add('eating');else if(state.toLowerCase().includes('hungry')||state.toLowerCase().includes('wait'))el.classList.add('hungry');el.innerHTML='P'+j+'<br><span>'+safe(state)+'</span>';}let r=String(e.resources||'');for(let j=0;j<4;j++){let f=$('fork'+j);let used=(new RegExp('Fork\\s*'+j+'[^\\n]*(held|in use|taken|using|owned|busy)','i')).test(r)||new RegExp('(held|in use|taken|using|owned|busy)[^\\n]*Fork\\s*'+j,'i').test(r);f.className='fork fork'+j+(used?' busy':'');f.innerHTML='F'+j+'<br><small>'+(used?'In use':'Free')+'</small>';}$('tableStatus').textContent=e.message;$('waitingQueue').textContent=(e.states||[]).map((s,j)=>/hungry|wait/i.test(s)?'P'+j:null).filter(Boolean).join(', ')||'None';}else{$('actors').innerHTML=labels.map((name,j)=>'<div class="actor"><strong>'+safe(name)+'</strong><br><span class="state">'+safe(e.states[j]||'Unknown')+'</span></div>').join('');$('resources').textContent=e.resources;}$('currentEvent').innerHTML='<p><strong>'+safe(e.message)+'</strong></p>';$('timeline').innerHTML=events.map((x,j)=>'<div class="event '+(j===index?'active':'')+'" data-i="'+j+'">'+(j+1)+'. '+safe(x.message)+'</div>').join('');document.querySelectorAll('.event').forEach(el=>el.addEventListener('click',()=>{pause();render(Number(el.dataset.i));}));}function pause(){if(timer!==null){clearInterval(timer);timer=null;}$('start').disabled=false;}function start(){pause();if(index>=events.length-1)render(0);timer=setInterval(()=>{if(index>=events.length-1){pause();return;}render(index+1);},Number($('speed').value));$('start').disabled=true;}$('start').addEventListener('click',start);$('pause').addEventListener('click',pause);$('reset').addEventListener('click',()=>{pause();render(0);});$('scrubber').max=Math.max(0,events.length-1);$('scrubber').addEventListener('input',e=>{pause();render(Number(e.target.value));});render(0);</script></body></html>
